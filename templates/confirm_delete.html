{% extends 'base.html' %}
{% load static %}

{% block meta %}
    <title>Delete Project - Confirm</title>
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
{% endblock meta %}

{% block content %}
    <main class="auth-container">
        <section id="delete-confirm" class="auth-section">
            <div class="section-container">
                <div class="auth-window terminal-window">
                    <header class="window-header">
                        <span class="window-title">CONFIRM DELETE</span>
                    </header>

                    <div class="auth-body">
                        <div class="confirm-message">
                            <p class="confirm-text">&gt; Delete the project below?</p>
                            <p class="project-name">{{ project.name }}</p>
                            <p class="confirm-warning">&gt; This action cannot be undone.</p>
                        </div>

                        <form method="post" class="auth-form">
                            {% csrf_token %}
                            <div class="form-actions confirm-actions">
                                <button type="submit" class="retro-btn delete-btn">Delete Project</button>
                                <a href="{% url 'main:show_main' %}" class="retro-btn cancel-btn">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <style>
        .confirm-message {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .confirm-text {
            color: var(--green-bright);
            font-size: 0.9rem;
            font-weight: 700;
            margin: 0;
        }

        .project-name {
            color: var(--green-glow);
            font-size: 1.1rem;
            padding-left: 1.5rem;
            margin: 0.5rem 0 0 0;
            word-break: break-word;
        }

        .confirm-warning {
            color: #ff6b6b;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0.5rem 0 0 0;
        }

        .confirm-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .delete-btn {
            background-color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .delete-btn:hover {
            background-color: #ff5252;
            border-color: #ff5252;
            box-shadow: 0 0 12px rgba(255, 107, 107, 0.5);
        }

        .cancel-btn {
            background-color: rgba(126, 203, 32, 0.15);
            border-color: var(--green-glow);
            color: var(--green-glow);
        }

        .cancel-btn:hover {
            background-color: rgba(126, 203, 32, 0.25);
            border-color: var(--green-bright);
            color: var(--green-bright);
        }
    </style>
{% endblock content %}
